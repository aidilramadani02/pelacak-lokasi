<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses Lokasi</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            font-family: sans-serif;
            background-color: #f8f9fa;
            margin: 0;
        }

        /* Tombol Animasi */
        .animated-btn {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ff4d4d, #cc0000);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(204, 0, 0, 0.4);
            outline: none;
            overflow: hidden;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        /* Animasi Tekan (Click/Active) */
        .animated-btn:active {
            transform: scale(0.92);
            box-shadow: 0 4px 10px rgba(204, 0, 0, 0.6);
        }

        /* Efek Gelombang Riak (Ripple Effect) */
        .animated-btn::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%, -50%);
            transform-origin: 50% 50%;
        }

        .animated-btn:focus:not(:active)::after {
            animation: ripple 0.6s ease-out;
        }

        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.8;
            }
            100% {
                transform: scale(40, 40);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <h2>Bagikan Lokasi Anda</h2>
    <p>Tekan tombol di bawah untuk memberikan akses lokasi Anda secara langsung.</p>
    
    <button id="btn" class="animated-btn">Kirim Lokasi</button>
    
    <p id="status" style="margin-top:20px; font-weight:bold;"></p>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBK8bGxy4z3x9TISxbXUnb2ZtNZsD6i6Ew",
            authDomain: "pelacak-lokasi-68500.firebaseapp.com",
            databaseURL: "https://pelacak-lokasi-68500-default-rtdb.firebaseio.com",
            projectId: "pelacak-lokasi-68500",
            storageBucket: "pelacak-lokasi-68500.firebasestorage.app",
            messagingSenderId: "1082973228536",
            appId: "1:1082973228536:web:5d024d643ed68259359a0d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById('btn').addEventListener('click', () => {
            const status = document.getElementById('status');
            status.innerText = "Mengambil lokasi...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const data = {
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude,
                            time: new Date().toLocaleTimeString()
                        };
                        db.ref('lokasi/target').set(data);
                        status.innerText = "Lokasi berhasil dikirim!";
                    },
                    (err) => {
                        status.innerText = "Gagal mengambil lokasi: " + err.message;
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                status.innerText = "Browser tidak mendukung Geolocation.";
            }
        });
    </script>
</body>
</html>
