<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses Lokasi</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            font-family: sans-serif;
            background-color: #f0f0f0;
            margin: 0;
        }

        h2 {
            margin-bottom: 10px;
            color: #333;
        }

        p {
            margin-bottom: 30px;
            color: #666;
            text-align: center;
            max-width: 80%;
        }

        .button-container {
            position: relative;
            padding-bottom: 20px;
        }

        .btn-3d {
            position: relative;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            outline: none;
            background: radial-gradient(circle at 50% 40%, #ff6666, #cc0000 70%, #990000);
            box-shadow: 
                0 0 0 4px #333,
                0 0 0 12px #111,
                0 15px 25px rgba(0,0,0,0.5),
                inset 0 2px 2px rgba(255,255,255,0.4),
                inset 0 -10px 15px rgba(0,0,0,0.2);
            transition: all 0.1s ease-out;
            overflow: hidden;
        }

        .btn-3d:hover {
            background: radial-gradient(circle at 50% 40%, #ff8080, #dd0000 70%, #b30000);
        }

        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 
                0 0 0 4px #333,
                0 0 0 12px #111,
                0 8px 15px rgba(0,0,0,0.5),
                inset 0 5px 10px rgba(0,0,0,0.3);
        }

        #status {
            margin-top: 25px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <h2>Bagikan Lokasi Anda</h2>
    <p>Tekan tombol di bawah untuk memberikan akses lokasi Anda secara langsung.</p>
    
    <div class="button-container">
        <button id="btn" class="btn-3d">Kirim Lokasi</button>
    </div>
    
    <p id="status"></p>

    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCZa5gNwHXsue-GjIrxPKE8qWmsrC-rgMQ",
            authDomain: "pelacak-lokasi-9074d.firebaseapp.com",
            databaseURL: "https://pelacak-lokasi-9074d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "pelacak-lokasi-9074d",
            storageBucket: "pelacak-lokasi-9074d.firebasestorage.app",
            messagingSenderId: "749144288015",
            appId: "1:749144288015:web:db015175a0d826aa8e2c7a",
            measurementId: "G-3MEBEKYKEB"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById('btn').addEventListener('click', () => {
            const status = document.getElementById('status');
            status.innerText = "Mengambil lokasi...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const data = {
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude,
                            time: new Date().toLocaleTimeString('id-ID')
                        };
                        db.ref('lokasi/target').set(data)
                            .then(() => {
                                status.innerText = "Lokasi berhasil dikirim!";
                            })
                            .catch((err) => {
                                status.innerText = "Gagal simpan ke Firebase: " + err.message;
                            });
                    },
                    (err) => {
                        status.innerText = "Gagal mengambil lokasi: " + err.message;
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                status.innerText = "Browser tidak mendukung Geolocation.";
            }
        });
    </script>
</body>
</html>
