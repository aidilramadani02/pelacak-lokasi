<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses Lokasi</title>
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; font-family:sans-serif;">
    <h2>Akses Lokasi</h2>
    <p>Tekan tombol di bawah untuk memberikan akses lokasi Anda secara langsung.</p>
    <button id="btn" style="width:120px; height:120px; border-radius:50%; background:red; border:none; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.3);"></button>
    <p id="status" style="margin-top:20px; font-weight:bold;"></p>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBK8bGxy4z3x9TISxbXUnb2ZtNZsD6i6Ew",
            authDomain: "pelacak-lokasi-68500.firebaseapp.com",
            databaseURL: "https://pelacak-lokasi-68500-default-rtdb.firebaseio.com",
            projectId: "pelacak-lokasi-68500",
            storageBucket: "pelacak-lokasi-68500.firebasestorage.app",
            messagingSenderId: "1082973228536",
            appId: "1:1082973228536:web:5d024d643ed68259359a0d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById('btn').addEventListener('click', () => {
            const status = document.getElementById('status');
            status.innerText = "Mengambil lokasi...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const data = {
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude,
                            time: new Date().toLocaleTimeString()
                        };
                        db.ref('lokasi/target').set(data);
                        status.innerText = "Lokasi berhasil dikirim!";
                    },
                    (err) => {
                        status.innerText = "Gagal mengambil lokasi: " + err.message;
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                status.innerText = "Browser tidak mendukung Geolocation.";
            }
        });
    </script>
</body>
</html>
