<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses Lokasi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>Bagikan Lokasi Anda</h2>
    <button id="btn">Kirim Lokasi Saat Ini</button>
    <p id="status"></p>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBK8bGxy4z3x9TISxbXUnb2ZtNZsD6i6Ew",
            authDomain: "pelacak-lokasi-68500.firebaseapp.com",
            databaseURL: "https://pelacak-lokasi-68500-default-rtdb.firebaseio.com",
            projectId: "pelacak-lokasi-68500",
            storageBucket: "pelacak-lokasi-68500.firebasestorage.app",
            messagingSenderId: "1082973228536",
            appId: "1:1082973228536:web:5d024d643ed68259359a0d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById('btn').addEventListener('click', () => {
            const status = document.getElementById('status');
            status.innerText = "Mengambil lokasi...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const data = {
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude,
                            time: new Date().toLocaleTimeString()
                        };
                        db.ref('lokasi/target').set(data);
                        status.innerText = "Lokasi berhasil dikirim!";
                    },
                    (err) => {
                        status.innerText = "Gagal mengambil lokasi: " + err.message;
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                status.innerText = "Browser tidak mendukung Geolocation.";
            }
        });
    </script>
</body>
</html>
