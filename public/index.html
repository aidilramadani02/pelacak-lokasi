<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses Lokasi</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            font-family: sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
        }

        h2 {
            margin-bottom: 10px;
            color: #f1f5f9;
        }

        p {
            margin-bottom: 35px;
            color: #94a3b8;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }

        .button-container {
            position: relative;
            padding-bottom: 20px;
        }

        /* Desain Tombol Modern Cyber / Neon Glow */
        .btn-3d {
            position: relative;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            box-shadow: 0 10px 25px rgba(0, 114, 255, 0.4),
                        0 0 0 8px rgba(0, 114, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
        }

        .btn-3d:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 15px 30px rgba(0, 114, 255, 0.6),
                        0 0 0 12px rgba(0, 114, 255, 0.2);
            background: linear-gradient(135deg, #00d2ff, #0080ff);
        }

        .btn-3d:active {
            transform: translateY(2px) scale(0.97);
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4),
                        0 0 0 6px rgba(0, 114, 255, 0.25);
        }

        #status {
            margin-top: 25px;
            font-weight: 600;
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <h2>Bagikan Lokasi Anda</h2>
    <p>Tekan tombol di bawah untuk memberikan akses lokasi Anda secara langsung.</p>
    
    <div class="button-container">
        <button id="btn" class="btn-3d">Kirim Lokasi</button>
    </div>
    
    <p id="status"></p>

    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCZa5gNwHXsue-GjIrxPKE8qWmsrC-rgMQ",
            authDomain: "pelacak-lokasi-9074d.firebaseapp.com",
            databaseURL: "https://pelacak-lokasi-9074d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "pelacak-lokasi-9074d",
            storageBucket: "pelacak-lokasi-9074d.firebasestorage.app",
            messagingSenderId: "749144288015",
            appId: "1:749144288015:web:db015175a0d826aa8e2c7a",
            measurementId: "G-3MEBEKYKEB"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById('btn').addEventListener('click', () => {
            const status = document.getElementById('status');
            status.innerText = "Mengambil lokasi...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const data = {
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude,
                            time: new Date().toLocaleTimeString('id-ID')
                        };
                        db.ref('lokasi/target').set(data)
                            .then(() => {
                                status.innerText = "Lokasi berhasil dikirim!";
                            })
                            .catch((err) => {
                                status.innerText = "Gagal simpan ke Firebase: " + err.message;
                            });
                    },
                    (err) => {
                        status.innerText = "Gagal mengambil lokasi: " + err.message;
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                status.innerText = "Browser tidak mendukung Geolocation.";
            }
        });
    </script>
</body>
</html>
