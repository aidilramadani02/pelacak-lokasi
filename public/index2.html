<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantau Lokasi</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 80vh; width: 100%; }
        body { font-family: sans-serif; margin: 0; padding: 10px; }
    </style>
</head>
<body>
    <h3>Peta Pemantauan Lokasi Realtime</h3>
    <p id="info">Menunggu data lokasi...</p>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCZa5gNwHXsue-GjIrxPKE8qWmsrC-rgMQ",
            authDomain: "pelacak-lokasi-9074d.firebaseapp.com",
            databaseURL: "https://pelacak-lokasi-9074d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "pelacak-lokasi-9074d",
            storageBucket: "pelacak-lokasi-9074d.firebasestorage.app",
            messagingSenderId: "749144288015",
            appId: "1:749144288015:web:db015175a0d826aa8e2c7a",
            measurementId: "G-3MEBEKYKEB"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let marker;

        db.ref('lokasi/target').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const { lat, lng, time } = data;
                document.getElementById('info').innerText = `Lokasi Terupdate (${time}): Lat ${lat}, Lng ${lng}`;
                
                if (!marker) {
                    marker = L.marker([lat, lng]).addTo(map);
                } else {
                    marker.setLatLng([lat, lng]);
                }
                map.setView([lat, lng], 16);
            }
        });
    </script>
</body>
</html>
